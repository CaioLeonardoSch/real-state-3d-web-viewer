<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Sugestão · Modo apresentação</title>
<meta name="description" content="Sugestão de modo apresentação: o corretor mostra o imóvel e o bairro ao cliente em tela cheia, passo a passo, com o mapa 3D.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Cpath d=%22M4 2l10 6-10 6z%22 fill=%22%23f2a65a%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="sugestoes/base.css">
<style>
  :root { --noite: #0b0f17; --creme: #f3ede2; --creme-2: #c9c1b3; --dourado: #f2a65a; --foco: var(--dourado); }
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--noite); color: var(--creme); }
  .palco { position: fixed; inset: 0; }
  .palco::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(90deg, rgba(11, 15, 23, 0.82) 0%, rgba(11, 15, 23, 0.35) 38%, rgba(11, 15, 23, 0) 60%), linear-gradient(0deg, rgba(11, 15, 23, 0.7), rgba(11, 15, 23, 0) 30%); }

  .topo { position: fixed; top: 0; left: 0; right: 0; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 16px 24px; }
  .topo .marca { font-weight: 700; letter-spacing: -0.01em; margin-right: auto; }
  .topo .marca small { display: block; font-weight: 400; font-size: 12px; color: var(--creme-2); }
  .bt { display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, 0.22); background: rgba(11, 15, 23, 0.5); color: var(--creme); font-size: 14px; text-decoration: none; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .bt[aria-pressed='true'] { background: var(--creme); color: #0b0f17; }

  .slide { position: fixed; left: clamp(20px, 5vw, 72px); bottom: clamp(110px, 16vh, 160px); z-index: 4; width: min(560px, calc(100vw - 40px)); }
  .slide .n { font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--dourado); }
  .slide h1 { margin: 12px 0 14px; font-size: clamp(36px, 5vw, 72px); line-height: 1; letter-spacing: -0.035em; }
  .slide h1 em { font-family: 'Playfair Display', serif; font-weight: 400; color: #ffd39c; }
  .slide p { margin: 0 0 16px; font-size: clamp(17px, 1.6vw, 22px); line-height: 1.5; color: var(--creme-2); max-width: 40ch; }
  .slide .grande { font-size: clamp(40px, 5vw, 64px); font-weight: 800; letter-spacing: -0.04em; color: var(--creme); }
  .slide .grande s { font-size: 0.4em; font-weight: 400; color: var(--creme-2); margin-left: 12px; }
  .slide .fichas { display: flex; gap: 10px; flex-wrap: wrap; }
  .slide .fichas span { padding: 8px 14px; border-radius: 999px; background: rgba(255, 255, 255, 0.1); font-size: 16px; }
  .slide .relogio { font-size: clamp(48px, 6vw, 84px); font-weight: 800; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; color: #ffd39c; }
  .slide .qr { display: flex; gap: 16px; align-items: center; }
  .slide .qr #qr { width: 120px; height: 120px; padding: 8px; background: #fff; border-radius: 12px; }
  .slide .qr #qr svg { width: 100%; height: 100%; }
  .entra { animation: entraSlide 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
  @keyframes entraSlide { from { opacity: 0; transform: translateY(24px); } }

  .rodape { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; align-items: center; gap: 14px; padding: 18px 24px 22px; }
  .pontos { display: flex; gap: 6px; margin-right: auto; }
  .pontos button { width: 34px; height: 6px; border-radius: 3px; border: 0; background: rgba(255, 255, 255, 0.22); padding: 0; position: relative; overflow: hidden; }
  .pontos button[aria-current='step'] { background: rgba(255, 255, 255, 0.35); }
  .pontos button[aria-current='step']::after { content: ''; position: absolute; inset: 0; background: var(--dourado); transform-origin: left; animation: enche var(--dur, 9s) linear both; }
  .pausado .pontos button[aria-current='step']::after { animation: none; transform: scaleX(1); }
  @keyframes enche { from { transform: scaleX(0); } }
  .navs { display: flex; gap: 8px; }
  .navs button { width: 48px; height: 48px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.25); background: rgba(11, 15, 23, 0.5); color: var(--creme); font-size: 20px; }
  .dica { font-size: 12px; color: var(--creme-2); }
  @media (max-width: 700px) { .dica { display: none; } .topo .bt span { display: none; } }
</style>
</head>
<body>
<div class="palco" id="palco"><img id="palco-img" alt=""></div>
<header class="topo">
  <div class="marca">Exemplo Imóveis<small>Modo apresentação · sugestão de design</small></div>
  <button class="bt" type="button" id="auto" aria-pressed="true">⏵ <span>Passar sozinho</span></button>
  <button class="bt" type="button" id="cheia">⛶ <span>Tela cheia</span></button>
  <a class="bt" id="sair" href="#">✕ <span>Sair</span></a>
</header>
<section class="slide" id="slide" aria-live="polite"></section>
<footer class="rodape">
  <div class="pontos" id="pontos" role="group" aria-label="Passos"></div>
  <span class="dica">← → para navegar · espaço para pausar</span>
  <div class="navs"><button type="button" id="ant" aria-label="Anterior">←</button><button type="button" id="prox" aria-label="Próximo">→</button></div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script type="module">
  import { porId, img, brl, desconto, custoMes } from './sugestoes/dados.js';
  import { montarMapa } from './sugestoes/mapa-vivo.js';
  import { DESTINOS, minutos, distancia, camada, doMapa } from './sugestoes/deslocamento.js';

  const i = porId(new URLSearchParams(location.search).get('id'));
  const d = desconto(i);
  const m = custoMes(i);
  document.title = `${i.titulo} · apresentação`;
  document.getElementById('palco-img').src = img(i.id);
  document.getElementById('sair').href = `sugestao-imovel.html?id=${i.id}`;
  const mapa = montarMapa(document.getElementById('palco'), { foco: i.id, giro: 2.5 });
  const centro = DESTINOS.find((x) => x.nome === 'Centro');
  const longe = distancia(i.centro, centro.centro) > 900;
  let b0 = 0;

  // cada passo: o texto e o que o mapa faz
  const PASSOS = [
    { n: 'O imóvel', dur: 9, html: () => `<h1>${i.titulo}, <em>${i.quartos} quartos.</em></h1><p>${i.bairro}, Joinville · cód. ${i.codigo}</p><div class="fichas"><span>${i.area} m²</span><span>${i.quartos} quartos</span><span>${i.vagas} vagas</span><span>${i.andar}º andar</span></div>`,
      mapa: () => mapa.camera({ center: i.centro, zoom: 18.6, pitch: 62, bearing: b0 }, 3500) },
    { n: 'O sol', dur: 12, html: () => `<h1>O sol <em>ao longo do dia.</em></h1><div class="relogio" id="relogio">6h00</div><p>Sombras calculadas para Joinville, no verão.</p>`,
      mapa: () => { mapa.camera({ center: i.centro, zoom: 18.2, pitch: 55, bearing: b0 + 30 }, 2500); diaPassando(); } },
    { n: 'A vista', dur: 10, html: () => `<h1>Do ${i.andar}º andar, <em>esta é a vista.</em></h1><p>Câmera na altura da janela, com os prédios vizinhos na altura real.</p>`,
      mapa: () => { mapa.hora(1080, 'summer'); const r = [0, 90, 180, 270].find((x) => !mapa.bloqueado(i.centro, i.raio, i.andar * 3 + 1.5, x)) ?? 0; mapa.vista(i.centro, i.raio, i.andar * 3 + 1.5, r); } },
    { n: 'O bairro', dur: 10, html: () => `<h1>${i.bairro}, <em>visto de cima.</em></h1><p>Morros, rio, ruas grandes e os serviços por perto.</p>`,
      mapa: () => mapa.camera({ center: i.centro, zoom: 15.4, pitch: 55, bearing: b0 + 120 }, 3500) },
    ...(longe ? [{ n: 'O caminho', dur: 9, html: () => { const [a, b] = minutos(i.centro, centro.centro, 'carro'); return `<h1>Até o Centro, <em>${a} a ${b} min.</em></h1><p>De carro, sem trânsito (estimativa).</p>`; },
      mapa: () => {
        if (!mapa.map) return;
        mapa.sairDaVista();
        camada(mapa.map, 'trajeto', { type: 'FeatureCollection', features: [{ type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: [i.centro, centro.centro] } }, { type: 'Feature', properties: {}, geometry: { type: 'Point', coordinates: centro.centro } }] }, { cor: '#f2a65a', linha: 4, tracejado: true });
        mapa.map.fitBounds([[Math.min(i.centro[0], centro.centro[0]), Math.min(i.centro[1], centro.centro[1])], [Math.max(i.centro[0], centro.centro[0]), Math.max(i.centro[1], centro.centro[1])]], { padding: { top: 120, bottom: 200, left: innerWidth * 0.45, right: 80 }, pitch: 40, duration: 2500, maxZoom: 15 });
      } }] : []),
    { n: 'O preço', dur: 10, html: () => `<h1>O preço, <em>sem rodeio.</em></h1><div class="grande">${brl(i.preco)}${d ? `<s>${brl(d.antes)}</s>` : ''}</div><p>${d ? `Baixou ${(d.pct * 100).toFixed(1).replace('.', ',')}% no site. ` : ''}Por mês, tudo somado: cerca de ${brl(m.total)}.</p>`,
      mapa: () => mapa.camera({ center: i.centro, zoom: 17.2, pitch: 60, bearing: b0 + 200 }, 3000) },
    { n: 'A visita', dur: 14, html: () => `<h1>Vamos <em>conhecer?</em></h1><div class="qr"><div id="qr"></div><p>Aponte a câmera: a mensagem para agendar já sai pronta no WhatsApp.</p></div>`,
      mapa: () => mapa.camera({ center: i.centro, zoom: 18.4, pitch: 64, bearing: b0 + 300 }, 3000) },
  ];

  let atual = 0;
  let auto = true;
  let timer = null;
  let dia = null;
  const pontos = document.getElementById('pontos');
  pontos.innerHTML = PASSOS.map((p, k) => `<button type="button" aria-label="${k + 1}. ${p.n}" data-k="${k}"></button>`).join('');

  function ir(k) {
    atual = (k + PASSOS.length) % PASSOS.length;
    const p = PASSOS[atual];
    clearInterval(dia);
    if (mapa.map) mapa.map.getSource('trajeto')?.setData(doMapa(mapa.map, { type: 'FeatureCollection', features: [] }));
    const s = document.getElementById('slide');
    s.innerHTML = `<span class="n">${atual + 1} de ${PASSOS.length} · ${p.n}</span>${p.html()}`;
    s.classList.remove('entra'); void s.offsetWidth; s.classList.add('entra');
    pontos.style.setProperty('--dur', `${p.dur}s`);
    pontos.querySelectorAll('button').forEach((b, j) => (j === atual ? b.setAttribute('aria-current', 'step') : b.removeAttribute('aria-current')));
    if (atual !== 2) mapa.sairDaVista();
    if (mapa.map) p.mapa();
    if (p.n === 'A visita') qr();
    clearTimeout(timer);
    if (auto) timer = setTimeout(() => ir(atual + 1), p.dur * 1000);
  }
  function diaPassando() {
    let min = 360;
    const rel = () => document.getElementById('relogio');
    dia = setInterval(() => {
      min = Math.min(1140, min + 10);
      mapa.hora(min, 'summer');
      if (rel()) rel().textContent = `${Math.floor(min / 60)}h${String(min % 60).padStart(2, '0')}`;
      if (min >= 1140) clearInterval(dia);
    }, 120);
  }
  function qr() {
    const el = document.getElementById('qr');
    const txt = `Olá! Quero visitar o ${i.titulo.toLowerCase()}, ${i.quartos} quartos, no ${i.bairro} (cód. ${i.codigo}).`;
    try {
      const q = window.qrcode(0, 'M'); q.addData(`https://wa.me/?text=${encodeURIComponent(txt)}`); q.make();
      el.innerHTML = q.createSvgTag({ cellSize: 3, margin: 0, scalable: true });
    } catch { el.remove(); }
  }

  document.getElementById('prox').addEventListener('click', () => ir(atual + 1));
  document.getElementById('ant').addEventListener('click', () => ir(atual - 1));
  pontos.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) ir(Number(b.dataset.k)); });
  const btAuto = document.getElementById('auto');
  const alternarAuto = () => {
    auto = !auto;
    btAuto.setAttribute('aria-pressed', String(auto));
    document.body.classList.toggle('pausado', !auto);
    mapa.girar(auto);
    if (auto) ir(atual); else clearTimeout(timer);
  };
  btAuto.addEventListener('click', alternarAuto);
  document.getElementById('cheia').addEventListener('click', () => (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.()));
  addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === 'PageDown') ir(atual + 1);
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') ir(atual - 1);
    else if (e.key === ' ') { e.preventDefault(); alternarAuto(); }
  });
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) alternarAuto();

  ir(0);
  mapa.pronto.then(() => { b0 = mapa.map.getBearing(); mapa.hora(1080, 'summer'); ir(atual); });
</script>
</body>
</html>
