# Serviço mensal do mapa: baixa o OpenStreetMap e o cadastro da Prefeitura, recalcula alturas, pavimento, árvores e
# postes, gera os tiles e abre um pull request com o relatório de mudanças (scripts/map-changes.mjs): prédios novos e
# removidos, alturas alteradas por bairro, pavimento, paisagem e os anúncios afetados. Nada vai ao ar sem alguém ler
# o relatório e aprovar o PR; o merge publica o mapa novo (workflow "Publicar no GitHub Pages").
#
# Na primeira vez: Settings → Actions → General → Workflow permissions → marque "Allow GitHub Actions to create and
# approve pull requests". Cada mês acrescenta ~20 MB (o .pmtiles) ao histórico do git: quando pesar, mova o
# arquivo para um armazenamento de objetos com nome por versão (docs/backend.md, "Serviço mensal do mapa").
name: Mapa mensal

on:
  schedule:
    # dia 3 de cada mês, 06:17 UTC (03:17 em Joinville): o extrato do OSM do dia anterior já saiu
    - cron: '17 6 3 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: mapa-mensal
  cancel-in-progress: false

jobs:
  mapa:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install osmium==4.3.1 shapely==2.2.0
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Guarda o mapa publicado, para comparar
        run: |
          mkdir -p "$RUNNER_TEMP/anterior"
          cp public/data/joinville.pmtiles public/data/meta.json "$RUNNER_TEMP/anterior/"

      - name: Baixa o OpenStreetMap (Santa Catarina)
        run: npm run data:download
      - name: Recorta a região (prédios, ruas, água, verde, árvores, postes, bairros)
        run: npm run data:region

      - name: Baixa o cadastro da Prefeitura (SIMGeo)
        # sem o cadastro as alturas cairiam para 6 m: se o servidor da Prefeitura estiver fora do ar, o job falha
        # aqui e nada muda; rode de novo mais tarde (Actions → Mapa mensal → Run workflow)
        run: npm run data:cadastre
      - name: Estima as alturas
        run: npm run data:heights
      - name: Gera os tiles (pico de ~4,3 GB de memória)
        run: npm run data:tiles
      # os anúncios de demonstração continuam nos prédios certos? (só avisa: o relatório lista os afetados)
      - name: Confere os anúncios de demonstração
        run: npm run validate:data
        continue-on-error: true
      - run: npm test

      - name: Relatório de mudanças
        id: relatorio
        run: |
          npm run map:changes -- --old "$RUNNER_TEMP/anterior/joinville.pmtiles" --old-meta "$RUNNER_TEMP/anterior/meta.json" \
            --out "$RUNNER_TEMP/relatorio.md" --json "$RUNNER_TEMP/resumo.json"
          echo "mes=$(node -p "new Date(require('./public/data/meta.json').osmTimestamp).toLocaleDateString('pt-BR', { month: '2-digit', year: 'numeric', timeZone: 'UTC' })")" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/relatorio.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Abre o pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: mapa-mensal
          delete-branch: true
          title: 'Mapa de ${{ steps.relatorio.outputs.mes }}: OpenStreetMap e cadastro atualizados'
          commit-message: 'Mapa de ${{ steps.relatorio.outputs.mes }}: OpenStreetMap e cadastro atualizados'
          body-path: ${{ runner.temp }}/relatorio.md
          add-paths: |
            public/data/joinville.pmtiles
            public/data/meta.json
            public/data/bairros.geojson
            public/data/bairros-areas.geojson
            public/data/boundary.geojson
