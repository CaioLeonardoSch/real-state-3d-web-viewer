# Publica o site no GitHub Pages depois que o CI (ci.yml) passa num push no main, ou manualmente, em Actions →
# "Publicar no GitHub Pages". Com o CI vermelho, nada vai ao ar.
# Na primeira vez: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Publicar no GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  # de hora em hora: as páginas dos anúncios novos do backend (para o Google) entram na publicação seguinte
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# um deploy por vez; um push novo cancela o que ainda está na fila
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Só o commit mais novo do main vai ao ar: o CI de um commit anterior pode terminar depois do CI do seguinte, e
  # publicar por último levaria o site de volta para trás (aconteceu com as árvores, no #13). O mais novo se publica
  # quando o CI dele passar.
  latest:
    runs-on: ubuntu-latest
    outputs:
      stale: ${{ steps.check.outputs.stale }}
    steps:
      - id: check
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$main" != "${{ github.event.workflow_run.head_sha }}" ]; then
            echo "::notice::${{ github.event.workflow_run.head_sha }} não é mais o último commit do main ($main): não publico"
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: latest
    # a execução de hora em hora só faz sentido com o backend configurado
    # depois do CI: só se ele passou num push (não num pull request)
    if: >-
      needs.latest.outputs.stale != 'true' &&
      (github.event_name != 'schedule' || vars.VITE_SUPABASE_URL != '') &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # o commit que o CI testou (sem ele, o checkout pegaria o main do momento)
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          # o Playwright só é usado no verify:e2e, que não roda aqui
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm test
      # inclui tsc --noEmit e as páginas estáticas dos anúncios (scripts/prerender.mjs); os dados já estão em public/data (o .pmtiles é lido por range requests, que o Pages aceita)
      - run: npm run build
        env:
          # Backend (Supabase): definidos em Settings → Secrets and variables → Actions → Variables.
          # Sem eles o site sai como hoje: só a demonstração, com "Anunciar" salvando no navegador.
          # A chave "anon" é pública por natureza (vai no site); quem protege os dados é o RLS do banco.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_DEMO_LISTINGS: ${{ vars.VITE_DEMO_LISTINGS }}
          # CAPTCHA (Cloudflare Turnstile), opcional: a Site Key é pública; ver docs/supabase.md, seção 9
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          # endereço do site nas páginas e no sitemap (padrão: o do GitHub Pages; troque ao usar domínio próprio)
          SITE_URL: ${{ vars.SITE_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
