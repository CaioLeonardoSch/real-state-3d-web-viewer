<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect x=%223%22 y=%222%22 width=%2210%22 height=%2213%22 fill=%22%23f28c18%22/%3E%3C/svg%3E" />
    <title>Mapa 3D Imobiliário · América, Joinville (demonstração)</title>
    <meta name="description" content="Protótipo de portal imobiliário com mapa 3D do bairro América, Joinville/SC. Imóveis e valores fictícios." />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <strong>América · Joinville</strong>
          <span class="demo-banner" role="note">Demonstração. Imóveis e valores fictícios.</span>
        </div>
        <button type="button" class="filters-toggle" aria-expanded="false" aria-controls="filters">Filtros</button>
        <form id="filters" class="filters" autocomplete="off" novalidate></form>
      </header>
      <main class="stage">
        <div id="map" aria-label="Mapa 3D do bairro América"></div>
        <div class="time-of-day" role="radiogroup" aria-label="Iluminação"></div>
        <section id="results" class="results" hidden aria-live="polite"></section>
        <aside id="drawer" class="drawer" aria-hidden="true" aria-labelledby="drawer-title" tabindex="-1"></aside>
        <div id="status" class="status" role="status"></div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
